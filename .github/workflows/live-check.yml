name: live-check
on:
  push:
    branches: [diag-live-check]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Safari engine (WebKit) and Chrome on this build
        run: |
          mkdir -p /tmp/lc && cd /tmp/lc && npm init -y > /dev/null && npm i playwright@1.65.1 > /dev/null 2>&1
          for i in 1 2 3; do timeout 420 npx playwright install --with-deps webkit chromium > install.log 2>&1 && break; echo "install try $i failed"; tail -5 install.log; done
          cp "$GITHUB_WORKSPACE/.github/serve.cjs" "$GITHUB_WORKSPACE/.github/live-check.mjs" .
          (node serve.cjs "$GITHUB_WORKSPACE" > serve.log 2>&1 &)
          sleep 1
          BASE=http://localhost:8765/rasd/ node live-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: /tmp/lc/shots
